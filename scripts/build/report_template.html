<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dc2decomp — avancement</title>

<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --line: #e4e0d8;
    --ink: #23201c;
    --dim: #6f6a62;
    --faint: #a09a90;
    --done: #3f8f5f;
    --part: #d9a13b;
    --none: #d8d3ca;
    --accent: #2f6f9f;
    --shadow: 0 1px 2px rgba(35, 32, 28, .06), 0 4px 12px rgba(35, 32, 28, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --panel: #1e2124; --line: #2f3338; --ink: #e6e3de;
      --dim: #9a958d; --faint: #6b665f; --done: #58ad78; --part: #d4a350;
      --none: #34383d; --accent: #6aa9d8;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181a; --panel: #1e2124; --line: #2f3338; --ink: #e6e3de;
    --dim: #9a958d; --faint: #6b665f; --done: #58ad78; --part: #d4a350;
    --none: #34383d; --accent: #6aa9d8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
  }
  :root[data-theme="light"] {
    --bg: #fbfaf8; --panel: #ffffff; --line: #e4e0d8; --ink: #23201c;
    --dim: #6f6a62; --faint: #a09a90; --done: #3f8f5f; --part: #d9a13b;
    --none: #d8d3ca; --accent: #2f6f9f;
    --shadow: 0 1px 2px rgba(35,32,28,.06), 0 4px 12px rgba(35,32,28,.04);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 2rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: .875rem; }
  .sub code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .82em; }

  /* Chiffre principal */
  .headline {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem;
    margin: 1.5rem 0 .5rem;
  }
  .headline .big { font-size: 2.75rem; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
  .headline .of { color: var(--dim); font-size: .9rem; }

  .bar {
    height: 10px; border-radius: 999px; background: var(--none);
    overflow: hidden; display: flex;
  }
  .bar > i { display: block; height: 100%; background: var(--done); }

  /* Secteurs */
  .sectors {
    display: grid; gap: .75rem; margin: 2rem 0;
    grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: .9rem 1rem; box-shadow: var(--shadow);
  }
  .card h3 { margin: 0 0 .5rem; font-size: .8125rem; font-weight: 600; color: var(--dim);
             text-transform: uppercase; letter-spacing: .045em; }
  .card .pct { font-size: 1.5rem; font-weight: 620; letter-spacing: -.02em; }
  .card .meta { color: var(--faint); font-size: .78rem; margin: .1rem 0 .55rem;
                font-variant-numeric: tabular-nums; }

  /* Treemap */
  section { margin: 2.5rem 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .3rem; }
  .hint { color: var(--dim); font-size: .82rem; margin: 0 0 .9rem; }
  #map { width: 100%; height: auto; display: block;
         border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  #map rect { stroke: var(--panel); stroke-width: 1.25; cursor: pointer; }
  #map rect:hover { stroke: var(--ink); stroke-width: 1.75; }
  #map text { pointer-events: none; font-size: 9px; fill: var(--ink); opacity: .75;
              font-family: ui-monospace, Menlo, Consolas, monospace; }

  .legend { display: flex; flex-wrap: wrap; gap: 1.1rem; margin-top: .7rem;
            color: var(--dim); font-size: .8rem; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* Table */
  .tools { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: .9rem; }
  input[type=search], select {
    font: inherit; font-size: .875rem; padding: .45rem .65rem;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel); color: var(--ink); min-width: 0;
  }
  input[type=search] { flex: 1 1 240px; }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px;
            background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th { font-size: .75rem; font-weight: 600; color: var(--dim); text-transform: uppercase;
       letter-spacing: .04em; cursor: pointer; user-select: none;
       position: sticky; top: 0; background: var(--panel); }
  th.sorted::after { content: " ↓"; color: var(--faint); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.unit { cursor: pointer; }
  tbody tr.unit:hover { background: color-mix(in oklab, var(--accent) 7%, transparent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8125rem; }
  .tag { display: inline-block; padding: .08rem .42rem; border-radius: 999px;
         font-size: .7rem; border: 1px solid var(--line); color: var(--dim); }
  .minibar { width: 74px; height: 6px; border-radius: 999px; background: var(--none);
             display: inline-block; overflow: hidden; vertical-align: middle; }
  .minibar > i { display: block; height: 100%; background: var(--done); }

  tr.detail > td { background: color-mix(in oklab, var(--ink) 3%, transparent);
                   white-space: normal; padding: .6rem .75rem .8rem; }
  .fns { display: grid; gap: .15rem .9rem;
         grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .fn { display: flex; gap: .5rem; align-items: baseline; font-size: .8125rem;
        font-family: ui-monospace, Menlo, Consolas, monospace; }
  .fn b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .fn s { text-decoration: none; color: var(--faint); font-variant-numeric: tabular-nums; }
  .fn u { text-decoration: none; width: 6px; height: 6px; border-radius: 50%;
          flex: none; background: var(--none); }
  .empty { padding: 2rem; text-align: center; color: var(--dim); }
  footer { margin-top: 3rem; color: var(--faint); font-size: .8rem; }
</style>

<div class="wrap">
  <header>
    <h1>dc2decomp — avancement</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="headline">
    <span class="big" id="pct">—</span>
    <span class="of" id="of"></span>
  </div>
  <div class="bar"><i id="mainbar" style="width:0"></i></div>

  <div class="sectors" id="sectors"></div>

  <section>
    <h2>Carte du code</h2>
    <p class="hint" id="maphint"></p>
    <div class="tools">
      <select id="scale">
        <option value="fn">Par fonction</option>
        <option value="unit">Par unité</option>
      </select>
      <select id="mapcolour">
        <option value="state">Couleur : avancement</option>
        <option value="sector">Couleur : secteur</option>
      </select>
    </div>
    <!-- Le rapport d'aspect est conservé : c'est ce qui garde les surfaces
         proportionnelles aux octets, ce que la carte affirme. -->
    <svg id="map" viewBox="0 0 1000 420"
         role="img" aria-label="Carte du code par taille"></svg>
    <div class="legend" id="maplegend"></div>
  </section>

  <section>
    <h2>Détail</h2>
    <div class="tools">
      <input type="search" id="q" placeholder="Chercher une unité ou une fonction…"
             autocomplete="off" spellcheck="false">
      <select id="sector"><option value="">Tous les secteurs</option></select>
      <select id="state">
        <option value="">Tous les états</option>
        <option value="todo">Pas commencé</option>
        <option value="wip">En cours</option>
        <option value="done">Identique</option>
      </select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-key="name">Unité</th>
          <th data-key="sector">Secteur</th>
          <th data-key="code" class="num">Octets</th>
          <th data-key="functions" class="num">Fonctions</th>
          <th data-key="share" class="num">Fait</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="hint" id="count" style="margin-top:.7rem"></p>
  </section>

  <footer>
    Engendré par <span class="mono">make report</span> depuis
    <span class="mono">objdiff-cli report</span>. Page autonome : aucune requête
    n'en sort.
  </footer>
</div>

<script>
const DATA = /*DATA*/null;

const fmt = n => n.toLocaleString('fr-FR');
const pct = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR',
  { minimumFractionDigits: n > 0 && n < 1 ? 2 : 1, maximumFractionDigits: 2 });

// Une unité est identique, partielle, ou encore du désassemblage. Les seuils
// sont ceux du verdict : 100 % veut dire tous les octets.
const colour = s => s >= 99.999 ? 'var(--done)' : s > 0 ? 'var(--part)' : 'var(--none)';
const state = s => s >= 99.999 ? 'done' : s > 0 ? 'wip' : 'todo';

const sectorName = {};
DATA.sectors.forEach(s => sectorName[s.id] = s.name);

/* -- en-tête ------------------------------------------------------------- */
const T = DATA.total;
const share = T.code ? 100 * T.done / T.code : 0;
document.getElementById('pct').textContent = pct(share) + ' %';
document.getElementById('of').textContent =
  `${fmt(T.done)} sur ${fmt(T.code)} octets de code · ${fmt(T.functions)} fonctions · ${fmt(T.units)} unités`;
document.getElementById('mainbar').style.width = Math.max(share, 0) + '%';
document.getElementById('sub').innerHTML =
  `Dark Chronicle PAL <code>SCES_511.90</code> · section <code>main</code> `
  + `sha1 <code>${DATA.sha1.slice(0, 12)}…</code> · ${DATA.generated}`;

/* -- secteurs ------------------------------------------------------------ */
document.getElementById('sectors').innerHTML = DATA.sectors.map(s => {
  const p = s.code ? 100 * s.done / s.code : 0;
  return `<div class="card">
    <h3>${s.name}</h3>
    <div class="pct">${pct(p)} %</div>
    <div class="meta">${fmt(s.done)} / ${fmt(s.code)} octets · ${fmt(s.functions)} fn</div>
    <div class="bar"><i style="width:${Math.max(p, 0)}%"></i></div>
  </div>`;
}).join('');

const sel = document.getElementById('sector');
DATA.sectors.forEach(s => sel.insertAdjacentHTML('beforeend',
  `<option value="${s.id}">${s.name}</option>`));

/* -- treemap ------------------------------------------------------------- */
/* Découpe en rangées d'aspect à peu près carré : la surface reste
   proportionnelle, et une tuile large est lisible. */
function squarify(items, x, y, w, h, out) {
  if (!items.length) return;
  if (items.length === 1) { out.push({ ...items[0], x, y, w, h }); return; }

  const total = items.reduce((a, d) => a + d.value, 0);
  let split = 0, taken = 0;
  const horizontal = w >= h;
  const target = total / 2;
  // La coupure au plus près de la moitié équilibre les deux moitiés, ce qui
  // borne l'allongement des tuiles sans calcul d'aspect à chaque pas.
  while (split < items.length - 1 && taken + items[split].value <= target) {
    taken += items[split].value; split++;
  }
  if (split === 0) { taken = items[0].value; split = 1; }

  const ratio = taken / total;
  if (horizontal) {
    squarify(items.slice(0, split), x, y, w * ratio, h, out);
    squarify(items.slice(split), x + w * ratio, y, w * (1 - ratio), h, out);
  } else {
    squarify(items.slice(0, split), x, y, w, h * ratio, out);
    squarify(items.slice(split), x, y + h * ratio, w, h * (1 - ratio), out);
  }
}

// Une teinte par secteur, pour la vue qui montre la provenance.
const SECTOR_COLOUR = {
  sdk: '#5b8dbe', middleware: '#b07cc6', runtime: '#c98a5b', game: '#5fa87f',
};

const escapeText = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function drawMap() {
  const svg = document.getElementById('map');
  const byFunction = document.getElementById('scale').value === 'fn';
  const bySector = document.getElementById('mapcolour').value === 'sector';
  const W = 1000, H = 420;

  // Par fonction : le binaire s'y répartit vraiment. Par unité : deux objets
  // portent 91 % du code, la carte le montre d'un coup d'œil.
  const items = byFunction
    ? DATA.functions.map(f => ({ value: f[1], label: f[0], share: f[2], sector: f[3],
                                 note: `${fmt(f[1])} octets · ${pct(f[2])} %` }))
    : DATA.units.filter(u => u.code > 0).map(u => ({
        value: u.code, label: u.name.replace(/^asm\/(text|data)\//, ''),
        share: u.share, sector: u.sector,
        note: `${fmt(u.code)} octets · ${u.functions} fn · ${pct(u.share)} %` }));

  const tiles = [];
  squarify(items, 0, 0, W, H, tiles);

  svg.innerHTML = tiles.map(t => {
    const fill = bySector ? (SECTOR_COLOUR[t.sector] || 'var(--none)') : colour(t.share);
    const opacity = bySector && t.share < 99.999 ? .5 : 1;
    const showText = t.w > 52 && t.h > 13;
    const label = escapeText(t.label);
    return `<g><title>${label}
${t.note} · ${sectorName[t.sector] || t.sector}</title>`
      + `<rect x="${t.x.toFixed(2)}" y="${t.y.toFixed(2)}" width="${t.w.toFixed(2)}"`
      + ` height="${t.h.toFixed(2)}" fill="${fill}" fill-opacity="${opacity}"`
      + ` data-name="${label}"></rect>`
      + (showText ? `<text x="${(t.x + 3).toFixed(1)}" y="${(t.y + 11).toFixed(1)}"`
          + ` clip-path="inset(0 ${Math.max(0, t.w - 5).toFixed(1)}px 0 0)">${label}</text>` : '')
      + `</g>`;
  }).join('');

  const legend = document.getElementById('maplegend');
  legend.innerHTML = bySector
    ? DATA.sectors.map(s => `<span><i class="swatch" style="background:${SECTOR_COLOUR[s.id]}"></i> ${s.name}</span>`).join('')
      + `<span><i class="swatch" style="background:var(--faint)"></i> teinte pleine = identique au disque</span>`
    : `<span><i class="swatch" style="background:var(--done)"></i> identique</span>`
      + `<span><i class="swatch" style="background:var(--part)"></i> partiel</span>`
      + `<span><i class="swatch" style="background:var(--none)"></i> désassemblage</span>`;

  document.getElementById('maphint').textContent = byFunction
    ? `Une tuile par fonction, surface proportionnelle à sa taille. Les ${fmt(DATA.functions.length)} `
      + `plus grosses sur ${fmt(DATA.functions_total)} sont dessinées, soit `
      + `${pct(100 * DATA.functions_shown_code / DATA.total.code)} % du code.`
    : `Une tuile par objet. Deux d'entre eux portent l'essentiel du code : les `
      + `frontières des unités de traduction du jeu ne sont pas encore retrouvées.`;

  // Cliquer une tuile porte la recherche sur elle.
  svg.querySelectorAll('rect').forEach(r => r.addEventListener('click', () => {
    document.getElementById('q').value = r.dataset.name;
    render();
    document.getElementById('rows').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
}

['scale', 'mapcolour'].forEach(id =>
  document.getElementById(id).addEventListener('change', drawMap));

/* -- tableau ------------------------------------------------------------- */
let sortKey = 'code', expanded = new Set();

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const wantSector = document.getElementById('sector').value;
  const wantState = document.getElementById('state').value;

  let rows = DATA.units.filter(u => {
    if (wantSector && u.sector !== wantSector) return false;
    if (wantState && state(u.share) !== wantState) return false;
    if (!q) return true;
    if (u.name.toLowerCase().includes(q)) return true;
    // La recherche porte aussi sur les fonctions : c'est par un nom de
    // fonction qu'on cherche l'unité qui la porte.
    return u.fns.some(f => f[0].toLowerCase().includes(q));
  });

  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return typeof x === 'string' ? x.localeCompare(y) : (y - x);
  });

  const body = document.getElementById('rows');
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty">Rien ne correspond.</td></tr>`;
  } else {
    body.innerHTML = rows.map(u => {
      const label = u.name.replace(/^asm\/(text|data)\//, '');
      const open = expanded.has(u.name);
      let html = `<tr class="unit" data-name="${u.name}">
        <td class="mono">${label}${u.source ? ` <span class="tag">${u.source}</span>` : ''}</td>
        <td><span class="tag">${sectorName[u.sector] || u.sector}</span></td>
        <td class="num">${fmt(u.code)}</td>
        <td class="num">${u.functions}</td>
        <td class="num"><span class="minibar"><i style="width:${u.share}%;background:${colour(u.share)}"></i></span>
            &nbsp;${pct(u.share)}</td></tr>`;
      if (open) {
        const list = u.fns.length
          ? u.fns.map(f => `<div class="fn"><u style="background:${colour(f[2])}"></u>`
              + `<b title="${f[0]}">${f[0]}</b><s>${fmt(f[1])}</s></div>`).join('')
          : '<span class="hint">Aucune fonction — unité de données.</span>';
        html += `<tr class="detail"><td colspan="5"><div class="fns">${list}</div></td></tr>`;
      }
      return html;
    }).join('');
  }

  document.getElementById('count').textContent =
    `${fmt(rows.length)} unités affichées · ${fmt(rows.reduce((a, u) => a + u.code, 0))} octets`;

  body.querySelectorAll('tr.unit').forEach(tr => tr.addEventListener('click', () => {
    const name = tr.dataset.name;
    expanded.has(name) ? expanded.delete(name) : expanded.add(name);
    render();
  }));
}

document.querySelectorAll('th[data-key]').forEach(th => th.addEventListener('click', () => {
  sortKey = th.dataset.key;
  document.querySelectorAll('th').forEach(h => h.classList.remove('sorted'));
  th.classList.add('sorted');
  render();
}));
['q', 'sector', 'state'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

drawMap();
render();
</script>
